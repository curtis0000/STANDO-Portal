<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重設密碼 · STANDO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #F9F9F9;
      color: #171A20;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card { width: 100%; max-width: 340px; }
    h1 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #5C5E62; text-align: center; margin-bottom: 28px; }
    .step-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
    .step-desc { font-size: 12px; color: #5C5E62; margin-bottom: 16px; line-height: 1.5; }
    label { display: block; font-size: 12px; color: #5C5E62; margin-bottom: 6px; }
    input {
      width: 100%;
      border: 1px solid #D0D1D2;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #3E6AE1; }
    input.code { letter-spacing: 6px; text-align: center; font-size: 20px; font-weight: 600; }
    button {
      width: 100%;
      padding: 11px;
      background: #3E6AE1;
      color: #fff;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: #2d57c4; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .msg { font-size: 12px; margin-bottom: 12px; line-height: 1.5; }
    .msg.err { color: #d93025; }
    .msg.ok { color: #188038; }
    .link {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #5C5E62;
      margin-top: 18px;
      text-decoration: none;
      cursor: pointer;
    }
    .link:hover { color: #3E6AE1; }
    .hide { display: none; }
    .done { text-align: center; }
    .done .big { font-size: 40px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>重設密碼</h1>
    <p class="sub">STANDO SYSTEMS · 帳號系統</p>

    <!-- Step 1：輸入 email -->
    <form id="form-email">
      <p class="step-title">步驟 1 / 3 · 取得驗證碼</p>
      <p class="step-desc">輸入你的帳號 Email，我們會寄一組驗證碼給你。</p>
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="username" />
      <div class="msg err hide" id="err-email"></div>
      <button type="submit" id="btn-email">寄送驗證碼</button>
    </form>

    <!-- Step 2：輸入驗證碼 -->
    <form id="form-code" class="hide">
      <p class="step-title">步驟 2 / 3 · 輸入驗證碼</p>
      <p class="step-desc">驗證碼已寄到 <strong id="email-echo"></strong>（可能在垃圾信件匣）。輸入信中的驗證碼。</p>
      <label>驗證碼</label>
      <input type="text" id="code" class="code" inputmode="numeric" maxlength="10" placeholder="驗證碼" required autocomplete="one-time-code" />
      <div class="msg err hide" id="err-code"></div>
      <button type="submit" id="btn-code">驗證</button>
      <span class="link" id="back-to-email">← 沒收到？重新輸入 Email 寄送</span>
    </form>

    <!-- Step 3：設定新密碼 -->
    <form id="form-pass" class="hide">
      <p class="step-title">步驟 3 / 3 · 設定新密碼</p>
      <p class="step-desc">至少 6 個字元。</p>
      <label>新密碼</label>
      <input type="password" id="pass1" placeholder="新密碼" required autocomplete="new-password" />
      <label>再次輸入</label>
      <input type="password" id="pass2" placeholder="再次輸入新密碼" required autocomplete="new-password" />
      <div class="msg err hide" id="err-pass"></div>
      <button type="submit" id="btn-pass">完成設定</button>
    </form>

    <!-- 完成 -->
    <div id="done" class="done hide">
      <div class="big">✓</div>
      <p class="step-title">密碼已更新</p>
      <p class="step-desc">你可以用新密碼登入任一系統了。</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://jpzgueafidiwmdosivxa.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OykvT-gPYbdkKacJjzkzbw_FQOi68x8';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentEmail = '';

    const $ = (id) => document.getElementById(id);
    const show = (el) => el.classList.remove('hide');
    const hide = (el) => el.classList.add('hide');
    function showErr(id, text) { const e = $(id); e.textContent = text; show(e); }
    function clearErr(id) { hide($(id)); }

    // Step 1：寄驗證碼
    $('form-email').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErr('err-email');
      const email = $('email').value.trim().toLowerCase();
      if (!email) return;
      const btn = $('btn-email');
      btn.disabled = true; btn.textContent = '寄送中⋯';
      const { error } = await sb.auth.resetPasswordForEmail(email);
      btn.disabled = false; btn.textContent = '寄送驗證碼';
      if (error) { showErr('err-email', '寄送失敗：' + error.message); return; }
      currentEmail = email;
      $('email-echo').textContent = email;
      hide($('form-email')); show($('form-code'));
      $('code').focus();
    });

    // Step 2：驗證碼
    $('form-code').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErr('err-code');
      const token = $('code').value.trim();
      if (token.length < 6) { showErr('err-code', '請輸入完整驗證碼'); return; }
      const btn = $('btn-code');
      btn.disabled = true; btn.textContent = '驗證中⋯';
      const { error } = await sb.auth.verifyOtp({ email: currentEmail, token, type: 'recovery' });
      btn.disabled = false; btn.textContent = '驗證';
      if (error) { showErr('err-code', '驗證碼錯誤或已過期，請確認後重試。'); return; }
      hide($('form-code')); show($('form-pass'));
      $('pass1').focus();
    });

    // 回到 step 1
    $('back-to-email').addEventListener('click', () => {
      clearErr('err-code');
      hide($('form-code')); show($('form-email'));
    });

    // Step 3：設新密碼
    $('form-pass').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErr('err-pass');
      const p1 = $('pass1').value, p2 = $('pass2').value;
      if (p1.length < 6) { showErr('err-pass', '密碼至少需要 6 個字元'); return; }
      if (p1 !== p2) { showErr('err-pass', '兩次輸入的密碼不相符'); return; }
      const btn = $('btn-pass');
      btn.disabled = true; btn.textContent = '儲存中⋯';
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) { btn.disabled = false; btn.textContent = '完成設定'; showErr('err-pass', '更新失敗：' + error.message); return; }
      await sb.auth.signOut();
      hide($('form-pass')); show($('done'));
    });
  </script>
</body>
</html>
