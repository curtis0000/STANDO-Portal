<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>申請帳號 · STANDO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #F9F9F9;
      color: #171A20;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card { width: 100%; max-width: 340px; }
    h1 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #5C5E62; text-align: center; margin-bottom: 28px; }
    .step-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
    .step-desc { font-size: 12px; color: #5C5E62; margin-bottom: 16px; line-height: 1.5; }
    label { display: block; font-size: 12px; color: #5C5E62; margin-bottom: 6px; }
    input {
      width: 100%;
      border: 1px solid #D0D1D2;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #3E6AE1; }
    button {
      width: 100%;
      padding: 11px;
      background: #3E6AE1;
      color: #fff;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: #2d57c4; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .msg { font-size: 12px; margin-bottom: 12px; line-height: 1.5; }
    .msg.err { color: #d93025; }
    .link {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #5C5E62;
      margin-top: 18px;
      text-decoration: none;
    }
    .link:hover { color: #3E6AE1; }
    .hide { display: none; }
    .done { text-align: center; }
    .done .big { font-size: 40px; margin-bottom: 12px; }
    .done .warn-title { font-size: 20px; font-weight: 600; color: #171A20; margin-bottom: 16px; }
    .done .steps {
      text-align: left;
      background: #FFF6E5;
      border: 2px solid #F5A623;
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 16px;
      font-size: 15px;
      line-height: 1.7;
    }
    .done .steps ol { padding-left: 22px; margin: 0; }
    .done .steps li { margin-bottom: 6px; }
    .done .steps li:last-child { margin-bottom: 0; }
    .done .steps .mail { word-break: break-all; }
    .done .steps .sub-note { font-size: 13px; color: #5C5E62; }
  </style>
</head>
<body>
  <div class="card">
    <h1>申請帳號</h1>
    <p class="sub">STANDO SYSTEMS · 帳號系統</p>

    <form id="form-reg">
      <p class="step-title">建立你的帳號</p>
      <p class="step-desc">註冊後系統會寄一封確認信，<strong>一定要點信中連結</strong>，否則任何系統都登不進去。確認完成後，請等管理員開通各系統權限。</p>
      <label>暱稱（讓管理員知道你是誰）</label>
      <input type="text" id="name" placeholder="例：小明" required />
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="username" />
      <label>密碼（至少 6 個字元）</label>
      <input type="password" id="pass" placeholder="設定密碼" required autocomplete="new-password" />
      <label>再輸入一次密碼</label>
      <input type="password" id="pass2" placeholder="再輸入一次，避免打錯" required autocomplete="new-password" />
      <div class="msg err hide" id="err"></div>
      <button type="submit" id="btn">送出申請</button>
    </form>

    <a class="link" href="index.html">← 返回首頁</a>

    <div id="done" class="done hide">
      <div class="big">📩</div>
      <p class="warn-title">還差一步，現在還不能登入</p>
      <div class="steps">
        <ol>
          <li>打開信箱 <strong class="mail" id="email-echo"></strong><br><span class="sub-note">找不到請翻垃圾信件匣</span></li>
          <li><strong>點確認信裡的連結</strong><br><span class="sub-note">沒點之前，登入都會顯示「帳號或密碼不對」</span></li>
          <li>通知管理員幫你開通權限</li>
        </ol>
      </div>
      <a class="link" href="index.html">← 返回首頁</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://jpzgueafidiwmdosivxa.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OykvT-gPYbdkKacJjzkzbw_FQOi68x8';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);

    $('form-reg').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('err').classList.add('hide');
      const name = $('name').value.trim();
      const email = $('email').value.trim().toLowerCase();
      const pass = $('pass').value;
      if (!name) { showErr('請填入暱稱'); return; }
      if (pass.length < 6) { showErr('密碼至少需要 6 個字元'); return; }
      if (pass !== $('pass2').value) { showErr('兩次輸入的密碼不一樣，請再確認'); return; }

      const btn = $('btn');
      btn.disabled = true; btn.textContent = '送出中⋯';
      const { data, error } = await sb.auth.signUp({
        email,
        password: pass,
        options: { data: { display_name: name } },
      });
      btn.disabled = false; btn.textContent = '送出申請';
      if (error) { showErr('申請失敗：' + error.message); return; }
      // Email 已註冊過時 Supabase 不報錯也不寄信（防止探測帳號），只會回一個沒有 identities 的假使用者
      if (!data.user || !data.user.identities || data.user.identities.length === 0) {
        showErr('這個 Email 已經有帳號了，請直接回首頁登入；忘記密碼請用「忘記密碼」。');
        return;
      }

      $('email-echo').textContent = email;
      $('form-reg').classList.add('hide');
      document.querySelectorAll('.card > .link')[0].classList.add('hide');
      $('done').classList.remove('hide');
    });

    function showErr(text) { const e = $('err'); e.textContent = text; e.classList.remove('hide'); }
  </script>
</body>
</html>
